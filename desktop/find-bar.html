<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The desktop app's find bar (#445): main.ts shows it over the top right of a window, in a view of its own, so the
     page's search never finds the bar's own text. Its keys (Enter, Shift+Enter, Esc, Ctrl+F / ⌘F) are main.ts's,
     desktop/keys.ts; this file only sends what is typed and clicked and shows the count. Nothing to fetch. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Find</title>
<style>
  /* The page's colours (web/src/styles.css): dark designed, light readable. */
  :root { color-scheme: light dark; --panel: light-dark(#ffffff, #1d2026); --text: light-dark(#1c1f26, #e3e6eb);
    --muted: light-dark(#646b78, #9aa1ad); --border: light-dark(#d9dde4, #333844); --accent: light-dark(#3b63c4, #7aa2f7);
    --hover: light-dark(#eef0f4, #2a2e36); --field: light-dark(#f6f7f9, #16181d); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
  .bar { box-sizing: border-box; height: 100%; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  input { flex: 1; min-width: 0; height: 28px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--field); color: var(--text); font: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  #count { min-width: 64px; padding: 0 4px; text-align: right; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  button { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 5px;
    background: transparent; color: var(--text); cursor: pointer; }
  button:hover { background: var(--hover); }
  button:disabled { color: var(--muted); opacity: .5; cursor: default; background: transparent; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="bar">
  <input id="text" type="text" placeholder="Find" aria-label="Find in page" spellcheck="false" autocomplete="off">
  <span id="count" aria-live="polite"></span>
  <button id="previous" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled><svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg></button>
  <button id="next" type="button" title="Next match (Enter)" aria-label="Next match" disabled><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
  <button id="close" type="button" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
</div>
<script>
  // window.ledungFind is the bar's preload (find-bar.cjs).
  const find = window.ledungFind;
  const text = document.getElementById('text');
  const count = document.getElementById('count');
  const steps = [document.getElementById('previous'), document.getElementById('next')];
  const typed = () => {
    if (text.value === '') count.textContent = '';
    for (const b of steps) b.disabled = text.value === '';
    find.query(text.value);
  };
  text.addEventListener('input', typed);
  steps[0].addEventListener('click', () => find.step(false));
  steps[1].addEventListener('click', () => find.step(true));
  document.getElementById('close').addEventListener('click', () => find.close());
  // Opened (again): the text box takes the keys, its text selected so typing replaces it.
  find.onOpen((kept) => {
    if (typeof kept === 'string' && text.value !== kept) text.value = kept;
    for (const b of steps) b.disabled = text.value === '';
    if (text.value === '') count.textContent = '';
    text.focus();
    text.select();
  });
  find.onCount((line) => {
    count.textContent = text.value === '' ? '' : line;
  });
</script>
</body>
</html>
