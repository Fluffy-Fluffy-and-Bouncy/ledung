<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Shown by main.ts when no Ledung answers (issue #358). Nothing to fetch: everything is in this file. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Ledung is not running</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b1d22; color: #e6e6e6;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: #a8adb7; margin: .5rem 0; }
  a.button { display: inline-block; margin-top: 1rem; padding: .5rem 1.4rem; border-radius: 6px; background: #3b6fd8;
    color: #fff; text-decoration: none; font-weight: 600; }
  a.button:hover { background: #4a7ee6; }
</style>
</head>
<body>
<main>
  <h1>Ledung is not running</h1>
  <p>Start Ledung on this computer, then press Retry.</p>
  <p id="reason"></p>
  <a class="button" href="#retry">Retry</a>
</main>
<script>
  // main.ts passes why in the address's query: which ports were tried, never the token.
  const q = new URLSearchParams(location.search);
  document.getElementById('reason').textContent = q.get('reason') || '';
</script>
</body>
</html>
