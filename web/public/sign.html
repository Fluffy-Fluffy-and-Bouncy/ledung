<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Ledung · sign in the browser</title>
<!-- Issue #463: Ledung's desktop app on a Mac can't show Touch ID (#427), so the default browser signs one waiting
     request for it here. The one-time code is the link's fragment. -->
<script src="/sign.js" type="module"></script>
</head>
<body style="font-family: system-ui, sans-serif; max-width: 30em; margin: 2em auto; padding: 0 1em; line-height: 1.4">
<h2>Sign for the Ledung app</h2>
<p id="what">Checking the link…</p>
<p id="request" hidden style="font-family: ui-monospace, monospace; padding: 0.5em; border: 1px solid #8884; border-radius: 4px; overflow-wrap: anywhere"></p>
<p><button id="go" hidden style="font-size: 1.1em">Sign with Touch ID</button></p>
<p id="done" hidden>Signed. Go back to the Ledung app: the change goes through there by itself. You can close this tab.</p>
</body>
</html>
